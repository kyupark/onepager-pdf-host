<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>onepager PDFs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #e0e0e0;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }
    .card {
      background: #fff;
      padding: 16px;
      display: block;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    .card:hover {
      background: #fafafa;
    }
    .card-title {
      font-weight: 500;
      color: #0066cc;
      font-size: 0.95rem;
      display: block;
      margin-bottom: 2px;
    }
    .card:hover .card-title {
      text-decoration: underline;
    }
    .card-meta {
      font-size: 0.78rem;
      color: #888;
    }
    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>onepager PDFs</h1>
  <p>One-page printable summaries of video transcripts.</p>

  <div class="grid">
    <a class="card" href="graham-weaver.pdf" target="_blank">
      <span class="card-title">Which Voice Will You Listen To?</span>
      <span class="card-meta">Graham Weaver · 1 page · 48KB</span>
    </a>
    <a class="card" href="karpathy-agentic.pdf" target="_blank">
      <span class="card-title">The Era of Agentic Engineering</span>
      <span class="card-meta">Andrej Karpathy · 1 page · 67KB</span>
    </a>
    <a class="card" href="matt-pocock.pdf" target="_blank">
      <span class="card-title">AI Coding Workshop</span>
      <span class="card-meta">Matt Pocock · 1 page · 59KB</span>
    </a>
  </div>
</body>
</html>
