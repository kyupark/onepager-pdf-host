<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>onepager PDFs</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 24px;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }
    li:last-child {
      border-bottom: none;
    }
    a {
      color: #0066cc;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
    .meta {
      font-size: 0.8rem;
      color: #888;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <h1>onepager PDFs</h1>
  <p>One-page printable summaries of video transcripts.</p>
  <ul>
    <li>
      <a href="graham-weaver.pdf" target="_blank">
        Which Voice Will You Listen To?
      </a>
      <div class="meta">Graham Weaver · 1 page · 47KB</div>
    </li>
    <li>
      <a href="matt-pocock.pdf" target="_blank">
        AI Coding Workshop
      </a>
      <div class="meta">Matt Pocock · 1 page · 61KB</div>
    </li>
  </ul>
</body>
</html>
